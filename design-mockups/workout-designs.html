<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workout Section — Design Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:36 40% 97%; --paper-2:34 32% 94%;
  --ink:30 14% 14%; --ink-2:28 10% 32%; --ink-3:24 8% 52%;
  --hairline:32 14% 86%;
  --card:0 0% 100%;
  --primary:150 28% 30%; --sage:148 24% 42%; --sage-light:148 22% 68%;
  --terracotta:14 58% 54%; --gold:38 70% 50%; --info:212 58% 48%; --success:150 45% 38%;
  --muted:32 18% 93%; --muted-fg:24 8% 52%;
  --radius:14px;
  --shadow-sm:0 1px 2px 0 hsl(28 20% 20% / .04), 0 1px 3px 0 hsl(28 20% 20% / .06);
  --shadow-md:0 2px 4px -1px hsl(28 20% 20% / .05), 0 4px 8px -2px hsl(28 20% 20% / .06);
  --shadow-lg:0 6px 16px -4px hsl(28 20% 20% / .08), 0 12px 32px -8px hsl(28 20% 20% / .08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#eae4d9;color:hsl(var(--ink));-webkit-font-smoothing:antialiased}
.font-d{font-family:'Fraunces',Georgia,serif}
.icon{width:1em;height:1em;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;display:inline-block;vertical-align:-0.125em}
.icon.fill{fill:currentColor;stroke:none}

/* ---- type accent helpers ---- */
.t-strength{--c:150 30% 30%;--cb:148 34% 92%;--cf:150 32% 27%;--g1:150 32% 33%;--g2:148 42% 49%}
.t-cardio{--c:14 58% 50%;--cb:14 62% 93%;--cf:14 58% 44%;--g1:14 62% 50%;--g2:28 82% 57%}
.t-flex{--c:212 58% 46%;--cb:208 56% 93%;--cf:212 58% 40%;--g1:212 56% 46%;--g2:198 62% 55%}
.t-sports{--c:38 72% 44%;--cb:40 76% 91%;--cf:35 70% 36%;--g1:38 76% 49%;--g2:45 86% 56%}

/* ================= STUDIO / SECTIONS ================= */
.section{width:1740px;padding:46px 54px 56px;background:linear-gradient(180deg,#efe9df,#e6dfd2)}
.cap{margin:0 0 30px 6px}
.cap-row{display:flex;align-items:baseline;gap:14px}
.cap-num{font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:hsl(var(--primary))}
.cap-title{font-family:'Fraunces',serif;font-size:34px;font-weight:600;letter-spacing:-.02em;color:hsl(var(--ink))}
.cap-insp{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:hsl(var(--terracotta));background:hsl(14 62% 93%);padding:5px 11px;border-radius:999px}
.cap-desc{margin-top:9px;font-size:15.5px;line-height:1.55;color:hsl(var(--ink-2));max-width:1050px}
.devrow{display:flex;gap:54px;align-items:flex-start}
.devlabel{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:hsl(var(--ink-3));margin:0 0 13px 4px;display:flex;align-items:center;gap:8px}
.devlabel::before{content:"";width:7px;height:7px;border-radius:2px;background:hsl(var(--primary))}

/* ================= PHONE FRAME ================= */
.phone{width:404px;background:#0c0c0e;border-radius:54px;padding:13px;box-shadow:0 30px 60px -20px rgba(40,30,20,.45),0 8px 18px -6px rgba(40,30,20,.3)}
.screen{position:relative;width:378px;height:818px;background:hsl(var(--paper));border-radius:42px;overflow:hidden;display:flex;flex-direction:column}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:30px;background:#0c0c0e;border-radius:18px;z-index:40}
.statusbar{height:50px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 32px;font-size:15px;font-weight:700;color:hsl(var(--ink))}
.sb-right{display:flex;align-items:center;gap:7px;font-size:13px}
.sb-batt{width:24px;height:12px;border:1.6px solid hsl(var(--ink));border-radius:3px;position:relative;display:inline-block}
.sb-batt::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:14px;background:hsl(var(--ink));border-radius:1px}
.sb-batt::before{content:"";position:absolute;right:-3px;top:3px;height:5px;width:2px;background:hsl(var(--ink));border-radius:0 1px 1px 0}
.scroll{flex:1;overflow:hidden;padding:6px 18px 0;position:relative}
.scroll::after{content:"";position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(to top,hsl(var(--paper)),transparent);pointer-events:none}

/* page header (shared) */
.pg-kicker{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.18em;color:hsl(var(--ink-3))}
.pg-title{font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
.pg-sub{margin-top:6px;font-size:13.5px;color:hsl(var(--ink-3));line-height:1.4}
.searchbar{margin-top:14px;height:42px;border-radius:14px;background:hsl(var(--card));border:1px solid hsl(var(--hairline));display:flex;align-items:center;gap:9px;padding:0 14px;color:hsl(var(--ink-3));font-size:14px}

/* filter chips (shared) */
.chips{display:flex;gap:8px;margin-top:16px;overflow:hidden}
.chip{padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;border:1px solid hsl(var(--hairline));background:hsl(var(--card));color:hsl(var(--ink-3))}
.chip.on{background:hsl(var(--primary));color:#fff;border-color:hsl(var(--primary))}

.sec-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;color:hsl(var(--ink-3));margin:22px 0 11px}
.day-label{font-size:12.5px;font-weight:700;color:hsl(var(--ink-2));margin:0 0 9px 2px}

/* bottom nav (shared) */
.bnav{position:absolute;left:14px;right:14px;bottom:14px;height:62px;border-radius:22px;background:hsl(var(--card)/.96);border:1px solid hsl(var(--hairline));box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:space-around;z-index:30;backdrop-filter:blur(12px)}
.bnav-i{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:hsl(var(--ink-3));flex:1}
.bnav-i.on{color:hsl(var(--primary))}
.bnav-i .icon{font-size:21px}
.bnav-fab{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:hsl(var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -4px hsl(var(--primary)/.6);border:3px solid hsl(var(--paper))}
.bnav-fab .icon{font-size:25px}

/* ================= DESKTOP FRAME ================= */
.desktop{width:1180px;border-radius:16px;overflow:hidden;border:1px solid hsl(var(--hairline));box-shadow:0 30px 60px -24px rgba(40,30,20,.42),0 10px 22px -10px rgba(40,30,20,.28);background:hsl(var(--card))}
.bbar{height:46px;background:hsl(var(--paper-2));border-bottom:1px solid hsl(var(--hairline));display:flex;align-items:center;padding:0 18px;gap:8px}
.tl{width:12px;height:12px;border-radius:50%}
.tl.r{background:#ec6a5e}.tl.y{background:#f4bf4f}.tl.g{background:#61c554}
.urlbar{margin-left:18px;flex:1;max-width:520px;height:28px;border-radius:8px;background:hsl(var(--card));border:1px solid hsl(var(--hairline));display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12.5px;color:hsl(var(--ink-3))}
.dbody{display:flex;height:768px;background:hsl(var(--paper))}
.sidebar{width:236px;flex:none;background:hsl(36 40% 98%);border-right:1px solid hsl(var(--hairline));padding:24px 16px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:hsl(var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.brand-name{font-family:'Fraunces',serif;font-size:23px;font-weight:600;letter-spacing:-.01em}
.snav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-size:14.5px;font-weight:600;color:hsl(var(--ink-2));margin-bottom:3px}
.snav .icon{font-size:19px;color:hsl(var(--ink-3))}
.snav.on{background:hsl(var(--primary)/.1);color:hsl(var(--primary))}
.snav.on .icon{color:hsl(var(--primary))}
.suser{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid hsl(var(--hairline))}
.savatar{width:34px;height:34px;border-radius:50%;background:hsl(var(--sage)/.2);color:hsl(var(--primary));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.dmain{flex:1;overflow:hidden;padding:30px 40px}
.dmain-inner{max-width:1180px}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.d-title{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.d-searchbar{width:280px;height:42px;border-radius:14px;background:hsl(var(--card));border:1px solid hsl(var(--hairline));display:flex;align-items:center;gap:9px;padding:0 14px;color:hsl(var(--ink-3));font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* generic small bits */
.dot{width:3px;height:3px;border-radius:50%;background:hsl(var(--ink-3)/.5);display:inline-block}
.muted{color:hsl(var(--ink-3))}

/* ===================================================== */
/* DESIGN 1 — SESSION LOG (Strong)                       */
/* ===================================================== */
.d1-card{position:relative;background:hsl(var(--card));border:1px solid hsl(var(--hairline));border-radius:18px;box-shadow:var(--shadow-sm);padding:15px 16px 15px 19px;overflow:hidden;margin-bottom:11px}
.d1-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:hsl(var(--c))}
.d1-head{display:flex;justify-content:space-between;align-items:flex-start}
.d1-type{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:hsl(var(--cf))}
.d1-title{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.d1-title.done{text-decoration:line-through;color:hsl(var(--ink-3))}
.d1-check{width:26px;height:26px;border-radius:50%;border:2px solid hsl(var(--hairline));display:flex;align-items:center;justify-content:center;color:hsl(var(--ink-3));flex:none}
.d1-check.on{background:hsl(var(--success));border-color:hsl(var(--success));color:#fff}
.d1-check .icon{font-size:15px}
.d1-meta{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12px;font-weight:600;color:hsl(var(--ink-3))}
.d1-meta .icon{font-size:13px;margin-right:3px;vertical-align:-.15em}
.d1-meta b{color:hsl(var(--ink-2));font-weight:700}
.d1-ex{margin-top:12px;border-top:1px solid hsl(var(--hairline));padding-top:4px}
.d1-ex-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13.5px;border-bottom:1px solid hsl(var(--hairline)/.6)}
.d1-ex-row:last-child{border-bottom:0}
.d1-ex-row .nm{font-weight:600;color:hsl(var(--ink))}
.d1-ex-row .sr{font-weight:700;color:hsl(var(--ink-2));font-variant-numeric:tabular-nums}
.d1-pr{display:inline-flex;align-items:center;gap:5px;margin-top:11px;font-size:11px;font-weight:800;color:hsl(var(--gold));background:hsl(38 70% 92%);padding:4px 9px;border-radius:999px}
.d1-pr .icon{font-size:13px}
.d1-week{background:hsl(var(--card));border:1px solid hsl(var(--hairline));border-radius:18px;box-shadow:var(--shadow-sm);padding:14px 16px;margin-top:16px}
.d1-week-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.d1-week-stat{font-size:13px;font-weight:700;color:hsl(var(--ink-2))}
.d1-week-stat b{font-size:22px;color:hsl(var(--primary));font-weight:800}
.d1-days{display:flex;gap:6px}
.d1-day{flex:1;text-align:center}
.d1-day span{font-size:9.5px;font-weight:800;color:hsl(var(--ink-3));display:block;margin-bottom:5px}
.d1-day i{display:block;height:30px;border-radius:9px;background:hsl(var(--muted));display:flex;align-items:center;justify-content:center;color:hsl(var(--ink-3))}
.d1-day.on i{background:hsl(var(--primary));color:#fff}

/* ===================================================== */
/* DESIGN 2 — ACTIVITY HERO (Apple Fitness)              */
/* ===================================================== */
.d2-hero{position:relative;background:linear-gradient(150deg,hsl(150 30% 22%),hsl(150 28% 30%));border-radius:24px;padding:20px 22px;color:#fff;overflow:hidden;box-shadow:var(--shadow-md)}
.d2-hero-row{display:flex;justify-content:space-between;align-items:center}
.d2-hero-k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.16em;color:hsl(148 30% 80%)}
.d2-hero-big{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:6px}
.d2-hero-big small{font-size:20px;font-weight:700;color:hsl(148 30% 80%)}
.d2-hero-sub{font-size:13px;color:hsl(148 28% 82%);margin-top:8px;max-width:170px;line-height:1.4}
.d2-ring{width:96px;height:96px;position:relative;flex:none}
.d2-ring svg{transform:rotate(-90deg)}
.d2-ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.d2-ring-label b{font-size:22px;font-weight:800;line-height:1}
.d2-ring-label span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:hsl(148 30% 80%);margin-top:2px}
.d2-hdots{display:flex;gap:7px;margin-top:18px}
.d2-hdots i{flex:1;height:6px;border-radius:999px;background:hsl(148 30% 50% / .4)}
.d2-hdots i.on{background:hsl(83 60% 70%)}
.d2-card{display:flex;align-items:center;gap:14px;background:hsl(var(--card));border:1px solid hsl(var(--hairline));border-radius:20px;box-shadow:var(--shadow-sm);padding:16px;margin-bottom:11px}
.d2-disc{width:54px;height:54px;border-radius:17px;flex:none;display:flex;align-items:center;justify-content:center;background:hsl(var(--cb));color:hsl(var(--cf))}
.d2-disc .icon{font-size:27px}
.d2-main{flex:1;min-width:0}
.d2-title{font-size:17.5px;font-weight:800;letter-spacing:-.01em}
.d2-title.done{text-decoration:line-through;color:hsl(var(--ink-3))}
.d2-sub{font-size:13px;color:hsl(var(--ink-3));margin-top:3px;font-weight:500}
.d2-tail{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.d2-done{width:26px;height:26px;border-radius:50%;background:hsl(var(--success));color:#fff;display:flex;align-items:center;justify-content:center}
.d2-done .icon{font-size:15px}
.d2-chev{color:hsl(var(--ink-3));font-size:20px}

/* ===================================================== */
/* DESIGN 3 — COVER CARDS (Nike Training Club)           */
/* ===================================================== */
.d3-card{background:hsl(var(--card));border:1px solid hsl(var(--hairline));border-radius:22px;box-shadow:var(--shadow-md);overflow:hidden;margin-bottom:14px}
.d3-cover{position:relative;height:118px;background:linear-gradient(135deg,hsl(var(--g1)),hsl(var(--g2)));padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.d3-wm{position:absolute;right:-16px;bottom:-28px;font-size:140px;color:#fff;opacity:.16;line-height:0}
.d3-cover-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.d3-type{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:#fff;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px)}
.d3-dur{font-size:11.5px;font-weight:800;color:#fff;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.16);padding:4px 10px;border-radius:999px}
.d3-dur .icon{font-size:13px}
.d3-title{position:relative;z-index:2;font-size:23px;font-weight:800;color:#fff;letter-spacing:-.02em;text-shadow:0 1px 8px rgba(0,0,0,.18)}
.d3-body{padding:13px 16px 15px}
.d3-ex{display:flex;align-items:center;gap:11px;padding:7px 0;font-size:14px;border-bottom:1px solid hsl(var(--hairline)/.7)}
.d3-ex:last-child{border-bottom:0}
.d3-ex i{width:22px;height:22px;border-radius:7px;background:hsl(var(--cb));color:hsl(var(--cf));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-style:normal;flex:none}
.d3-ex .nm{flex:1;font-weight:600}
.d3-ex b{font-weight:700;color:hsl(var(--ink-2));font-variant-numeric:tabular-nums}
.d3-hero{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,hsl(14 60% 52%),hsl(28 82% 58%));padding:20px;color:#fff;box-shadow:var(--shadow-md)}
.d3-hero .d3-wm{font-size:150px;opacity:.18}
.d3-hero-k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;opacity:.85;position:relative;z-index:2}
.d3-hero-t{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:5px;position:relative;z-index:2}
.d3-hero-s{font-size:13.5px;margin-top:7px;opacity:.92;position:relative;z-index:2}

/* ===================================================== */
/* DESIGN 4 — DIARY LIST (MyFitnessPal)                  */
/* ===================================================== */
.d4-card{background:hsl(var(--card));border:1px solid hsl(var(--hairline));border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:13px}
.d4-dhead{display:flex;justify-content:space-between;align-items:baseline;padding:13px 16px 11px;border-bottom:1px solid hsl(var(--hairline))}
.d4-dhead .dl{font-size:14px;font-weight:800;letter-spacing:-.01em}
.d4-dhead .dm{font-size:11.5px;font-weight:600;color:hsl(var(--ink-3))}
.d4-row{display:flex;align-items:center;gap:13px;padding:11px 16px;border-bottom:1px solid hsl(var(--hairline)/.7)}
.d4-row:last-child{border-bottom:0}
.d4-ic{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:hsl(var(--cb));color:hsl(var(--cf))}
.d4-ic .icon{font-size:21px}
.d4-rmain{flex:1;min-width:0}
.d4-rt{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.d4-rt.done{text-decoration:line-through;color:hsl(var(--ink-3))}
.d4-rs{font-size:12px;color:hsl(var(--ink-3));margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d4-rmeta{display:flex;align-items:center;gap:8px;flex:none;font-size:12.5px;font-weight:700;color:hsl(var(--ink-2))}
.d4-rmeta .chev{color:hsl(var(--ink-3)/.7);font-size:18px}
.d4-rmeta .icon{font-size:18px}
.d4-summary{display:flex;gap:10px;margin-top:2px}
.d4-sumc{flex:1;background:hsl(var(--card));border:1px solid hsl(var(--hairline));border-radius:14px;padding:11px 13px;box-shadow:var(--shadow-sm)}
.d4-sumc b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.d4-sumc span{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:hsl(var(--ink-3));margin-top:2px}
.d4-sumc .icon{font-size:15px;color:hsl(var(--primary))}

/* ===================================================== */
/* DESIGN 5 — STAT CARD (Hevy)                           */
/* ===================================================== */
.d5-card{background:hsl(var(--card));border:1px solid hsl(var(--hairline));border-radius:20px;box-shadow:var(--shadow-sm);padding:15px 16px;margin-bottom:12px}
.d5-head{display:flex;align-items:center;gap:10px}
.d5-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:hsl(var(--cf));background:hsl(var(--cb));padding:5px 10px;border-radius:999px;flex:none}
.d5-chip .icon{font-size:14px}
.d5-title{font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d5-more{color:hsl(var(--ink-3));font-size:20px;flex:none}
.d5-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:hsl(var(--hairline));border:1px solid hsl(var(--hairline));border-radius:13px;overflow:hidden;margin-top:13px}
.d5-stat{background:hsl(var(--card));padding:10px 6px;text-align:center}

/* ============ DESIGN 5 : STAT CARD ============ */
function d5card(cls,icon,type,title,stats,ex){return `
  <div class="d5-card ${cls}">
    <div class="d5-head"><span class="d5-chip"><svg class=icon><use href="#i-${icon}"/></svg>${type}</span><div class="d5-title">${title}</div><svg class="d5-more icon"><use href="#i-more"/></svg></div>
    <div class="d5-stats">${stats.map(s=>`<div class="d5-stat ${s[2]?'hl':''}"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
    <div class="d5-ex">${ex.map(e=>`<div class="d5-ex-row"><span class="d5-x">${e[0]}</span><span class="nm">${e[1]}</span><span class="bs">${e[2]}</span></div>`).join('')}</div>
  </div>`;}
