<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Single Workout — Detail & Edit Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:36 40% 97%; --paper-2:34 32% 94%;
  --ink:30 14% 14%; --ink-2:28 10% 32%; --ink-3:24 8% 52%;
  --hairline:32 14% 86%; --card:0 0% 100%;
  --primary:150 28% 30%; --sage:148 24% 42%; --sage-light:148 22% 68%;
  --terracotta:14 58% 54%; --gold:38 70% 50%; --info:212 58% 48%; --success:150 45% 38%;
  --muted:32 18% 93%;
  --shadow-sm:0 1px 2px 0 hsl(28 20% 20% / .05), 0 1px 3px 0 hsl(28 20% 20% / .07);
  --shadow-md:0 2px 4px -1px hsl(28 20% 20% / .06), 0 4px 10px -2px hsl(28 20% 20% / .08);
  --shadow-lg:0 8px 20px -6px hsl(28 20% 20% / .12), 0 18px 44px -10px hsl(28 20% 20% / .14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#eae4d9;color:hsl(var(--ink));-webkit-font-smoothing:antialiased}
.font-d{font-family:'Fraunces',Georgia,serif}
.icon{width:1em;height:1em;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;display:inline-block;vertical-align:-.125em}
.t-strength{--c:150 30% 30%;--cb:148 34% 92%;--cf:150 32% 27%;--g1:150 34% 30%;--g2:148 40% 46%}
.muted{color:hsl(var(--ink-3))}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- studio / sections ---------- */
.section{width:1900px;padding:44px 50px 54px;background:linear-gradient(180deg,#efe9df,#e6dfd2)}
.cap{margin:0 0 26px 4px;max-width:1500px}
.cap-row{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}
.cap-num{font-family:'Fraunces',serif;font-size:29px;font-weight:600;color:hsl(var(--primary))}
.cap-title{font-family:'Fraunces',serif;font-size:33px;font-weight:600;letter-spacing:-.02em}
.cap-insp{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:hsl(var(--terracotta));background:hsl(14 62% 93%);padding:5px 11px;border-radius:999px}
.cap-desc{margin-top:9px;font-size:15px;line-height:1.55;color:hsl(var(--ink-2));max-width:1180px}
.devrow{display:flex;gap:46px;align-items:flex-start}
.devrow+.devrow{margin-top:30px}
.col .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;color:hsl(var(--ink-3));margin:0 0 12px 3px;display:flex;align-items:center;gap:8px}
.col .lab::before{content:"";width:7px;height:7px;border-radius:2px;background:hsl(var(--primary))}
.col .lab.edit::before{background:hsl(var(--terracotta))}

/* ---------- phone frame ---------- */
.phone{width:392px;background:#0c0c0e;border-radius:52px;padding:12px;box-shadow:0 26px 52px -20px rgba(40,30,20,.45)}
.screen{position:relative;width:368px;height:798px;background:hsl(var(--paper));border-radius:42px;overflow:hidden;display:flex;flex-direction:column}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;height:28px;background:#0c0c0e;border-radius:16px;z-index:60}
.sbar{height:46px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px 0 30px;font-size:14.5px;font-weight:700}
.sbar .r{display:flex;align-items:center;gap:6px;font-size:12px}
.batt{width:22px;height:11px;border:1.5px solid hsl(var(--ink));border-radius:3px;position:relative}
.batt::after{content:"";position:absolute;inset:1.5px;width:12px;background:hsl(var(--ink));border-radius:1px}
.scroll{flex:1;overflow:hidden;padding:4px 16px 0;position:relative}
.fade{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(to top,hsl(var(--paper)),transparent);pointer-events:none;z-index:15}

/* ---------- desktop frame ---------- */
.desktop{width:884px;border-radius:15px;overflow:hidden;border:1px solid hsl(var(--hairline));box-shadow:0 26px 54px -22px rgba(40,30,20,.4);background:hsl(var(--card))}
.bbar{height:42px;background:hsl(var(--paper-2));border-bottom:1px solid hsl(var(--hairline));display:flex;align-items:center;padding:0 15px;gap:7px}
.tl{width:11px;height:11px;border-radius:50%}.tl.r{background:#ec6a5e}.tl.y{background:#f4bf4f}.tl.g{background:#61c554}
.url{margin-left:14px;flex:1;max-width:360px;height:25px;border-radius:7px;background:hsl(var(--card));border:1px solid hsl(var(--hairline));display:flex;align-items:center;gap:7px;padding:0 11px;font-size:11.5px;color:hsl(var(--ink-3))}
.dbody{display:flex;height:712px;background:hsl(var(--paper));position:relative}
.rail{width:60px;flex:none;background:hsl(36 40% 98%);border-right:1px solid hsl(var(--hairline));display:flex;flex-direction:column;align-items:center;padding:15px 0;gap:5px}
.rail .logo{width:30px;height:30px;border-radius:9px;background:hsl(var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:9px}
.rail a{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:hsl(var(--ink-3));font-size:20px}
.rail a.on{background:hsl(var(--primary)/.12);color:hsl(var(--primary))}
.dmain{flex:1;overflow:hidden;position:relative}
.dscroll{height:100%;overflow:hidden;padding:26px 32px;position:relative}

/* ---------- shared content bits ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;height:38px;margin-bottom:8px}
.tb-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:hsl(var(--ink-2));font-size:21px;background:hsl(var(--card));border:1px solid hsl(var(--hairline))}
.tb-t{font-size:13px;font-weight:700;color:hsl(var(--ink-3))}
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.16em}
.flabel{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:hsl(var(--ink-3));margin-bottom:6px;display:block}
.field{display:block;width:100%;border:1.5px solid hsl(var(--c,var(--hairline))/.55);background:hsl(var(--card));border-radius:11px;padding:10px 13px;font-size:14px;font-weight:600;color:hsl(var(--ink))}
.field.lg{font-size:19px;font-weight:800;letter-spacing:-.01em}
.field.focus{border-color:hsl(var(--c));box-shadow:0 0 0 3px hsl(var(--c)/.12)}
.seg{display:flex;border:1px solid hsl(var(--hairline));border-radius:11px;overflow:hidden;background:hsl(var(--card))}
.seg span{flex:1;text-align:center;padding:8px 6px;font-size:12px;font-weight:700;color:hsl(var(--ink-3))}
.seg span.on{background:hsl(var(--c));color:#fff}
.step{display:inline-flex;align-items:center;border:1.5px solid hsl(var(--hairline));border-radius:10px;overflow:hidden;background:hsl(var(--card))}
.step button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:hsl(var(--ink-2));background:transparent;border:0;cursor:pointer}
.step button .icon{font-size:15px}
.step b{min-width:38px;text-align:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;color:hsl(var(--ink))}
.savebar{position:absolute;left:0;right:0;bottom:0;padding:13px 16px 22px;background:hsl(var(--card)/.97);border-top:1px solid hsl(var(--hairline));display:flex;gap:10px;z-index:30;backdrop-filter:blur(8px)}
.btn-primary{flex:1;height:46px;border-radius:13px;background:hsl(var(--c,var(--primary)));color:#fff;font-weight:800;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;border:0}
.btn-ghost{height:46px;padding:0 18px;border-radius:13px;border:1px solid hsl(var(--hairline));background:hsl(var(--card));color:hsl(var(--ink-2));font-weight:700;font-size:14px}
.btn-edit{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 18px;border-radius:12px;background:hsl(var(--c,var(--primary)));color:#fff;font-weight:800;font-size:14px;border:0}
.dashed{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border:1.5px dashed hsl(var(--hairline));border-radius:12px;color:hsl(var(--ink-3));font-size:13px;font-weight:700;background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:hsl(var(--ink-2));background:hsl(var(--muted));padding:6px 11px;border-radius:999px}
.chip .icon{font-size:14px;color:hsl(var(--ink-3))}

/* =====================================================
   C1 — ACTIVITY DETAIL (Apple Fitness)
   ===================================================== */
.c1-hero{position:relative;border-radius:24px;padding:20px;color:#fff;overflow:hidden;background:linear-gradient(145deg,hsl(var(--g1)),hsl(var(--g2)));box-shadow:var(--shadow-md)}
.c1-hero .wm{position:absolute;right:-18px;bottom:-30px;font-size:150px;opacity:.16;line-height:0}
.c1-hero .k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.15em;opacity:.85;position:relative;z-index:2}
.c1-hero .t{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:4px;position:relative;z-index:2}
.c1-hero .row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.c1-ring{width:74px;height:74px;position:relative;flex:none}
.c1-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.c1-stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px;margin-top:14px}
.c1-stat{background:hsl(var(--card));border:1px solid hsl(var(--hairline));border-radius:15px;box-shadow:var(--shadow-sm);padding:12px 8px;text-align:center}
.c1-stat .ic{font-size:16px;color:hsl(var(--c));margin-bottom:5px}
.c1-stat b{font-size:17px;font-weight:800;letter-spacing:-.02em;display:block}
.c1-stat span{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:hsl(var(--ink-3))}
.c1-exh{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;color:hsl(var(--ink-3));margin:18px 0 10px}
.c1-ex{background:hsl(var(--card));border:1px solid hsl(var(--hairline));border-radius:16px;box-shadow:var(--shadow-sm);padding:13px 15px;margin-bottom:10px}
.c1-ex-top{display:flex;align-items:center;gap:11px}
.c1-ex-ic{width:38px;height:38px;border-radius:11px;flex:none;background:hsl(var(--cb));color:hsl(var(--cf));display:flex;align-items:center;justify-content:center;font-size:20px}
.c1-ex-nm{font-size:15px;font-weight:800;flex:1}
.c1-ex-sum{font-size:12.5px;font-weight:700;color:hsl(var(--c));tnum}
.c1-ex-sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.c1-pill{font-size:11px;font-weight:700;color:hsl(var(--ink-2));background:hsl(var(--muted));border-radius:8px;padding:5px 8px;font-variant-numeric:tabular-nums}
.c1-setrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid hsl(var(--hairline)/.7)}
.c1-setn{width:22px;height:22px;border-radius:7px;background:hsl(var(--cb));color:hsl(var(--cf));font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* =====================================================
   C2 — WORKOUT LOGGER (Strong / Hevy)
   ===================================================== */
.c2-wrap{background:hsl(var(--card));border:1px solid hsl(var(--hairline));border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden}
.c2-head{padding:14px 15px;border-bottom:1px solid hsl(var(--hairline))}
.c2-head .t{font-size:19px;font-weight:800;letter-spacing:-.01em}
.c2-head .m{display:flex;gap:8px;margin-top:8px}
.c2-mtag{font-size:11.5px;font-weight:800;color:hsl(var(--ink-2));background:hsl(var(--muted));border-radius:8px;padding:5px 9px;font-variant-numeric:tabular-nums}
.c2-mtag.timer{background:hsl(var(--cb));color:hsl(var(--cf))}
.c2-ex{padding:12px 15px;border-bottom:1px solid hsl(var(--hairline))}
.c2-ex:last-child{border-bottom:0}
.c2-ex-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.c2-ex-h .nm{font-size:14.5px;font-weight:800;color:hsl(var(--cf));flex:1}
.c2-ex-h .more{color:hsl(var(--ink-3));font-size:18px}
.c2-grid{width:100%;font-size:13px;border-collapse:collapse}
.c2-grid th{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:hsl(var(--ink-3));text-align:center;padding:3px 4px}
.c2-grid th.l,.c2-grid td.l{text-align:left}
.c2-grid td{text-align:center;padding:5px 4px;font-weight:700;font-variant-numeric:tabular-nums}
.c2-setn{width:24px;height:24px;border-radius:7px;background:hsl(var(--muted));font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;color:hsl(var(--ink-2))}
.c2-row.done td{color:hsl(var(--ink-3))}
.c2-row.done .c2-setn{background:hsl(var(--success)/.16);color:hsl(var(--success))}
.c2-ck{width:24px;height:24px;border-radius:7px;border:1.5px solid hsl(var(--hairline));display:inline-flex;align-items:center;justify-content:center;color:hsl(var(--ink-3))}
.c2-ck.on{background:hsl(var(--success));border-color:hsl(var(--success));color:#fff}
.c2-cell{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:30px;border:1.5px solid hsl(var(--hairline));border-radius:8px;font-weight:800;background:hsl(var(--card))}
.c2-cell.kg{background:hsl(var(--cb)/.5)}
.c2-addset{width:100%;margin-top:8px;padding:8px;border:1.5px dashed hsl(var(--hairline));border-radius:9px;font-size:12px;font-weight:800;color:hsl(var(--cf));background:transparent;text-transform:uppercase;letter-spacing:.04em}

/* =====================================================
   C3 — BOTTOM-SHEET COMPOSER (Google Fit)
   ===================================================== */
.c3-back{position:absolute;inset:0;background:hsl(var(--paper));padding:14px 16px;filter:blur(1.5px);opacity:.55}
.c3-back .bk{height:64px;border-radius:16px;background:hsl(var(--card));border:1px solid hsl(var(--hairline));margin-bottom:11px}
.c3-dim{position:absolute;inset:0;background:rgba(20,16,10,.42);z-index:10}
.c3-sheet{position:absolute;left:0;right:0;bottom:0;background:hsl(var(--card));border-radius:26px 26px 0 0;box-shadow:0 -10px 40px -8px rgba(0,0,0,.3);z-index:20;padding:10px 18px 0;display:flex;flex-direction:column}
.c3-grab{width:40px;height:5px;border-radius:999px;background:hsl(var(--hairline));margin:4px auto 14px}
.c3-sheet .t{font-size:21px;font-weight:800;letter-spacing:-.01em}
.c3-sheet .typechip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:hsl(var(--cf));background:hsl(var(--cb));padding:5px 10px;border-radius:999px;margin-top:8px}
.c3-chips{display:flex;gap:8px;margin-top:13px}
.c3-chip{flex:1;background:hsl(var(--muted));border-radius:13px;padding:10px;text-align:center}
.c3-chip b{font-size:16px;font-weight:800;display:block;letter-spacing:-.02em}
.c3-chip span{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:hsl(var(--ink-3))}
.c3-exh{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:hsl(var(--ink-3));margin:16px 0 8px}
.c3-ex{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid hsl(var(--hairline)/.7)}
.c3-ex .ic{width:36px;height:36px;border-radius:11px;flex:none;background:hsl(var(--cb));color:hsl(var(--cf));display:flex;align-items:center;justify-content:center;font-size:18px}
.c3-ex .nm{flex:1;font-size:14px;font-weight:700}
.c3-ex .sr{font-size:12.5px;font-weight:700;color:hsl(var(--c));font-variant-numeric:tabular-nums}
.c3-ex .step{transform:scale(.92);transform-origin:right}

/* =====================================================
   C4 — GUIDED CAROUSEL (Nike Training Club / Fitbod)
   ===================================================== */
.c4-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.c4-dots{display:flex;gap:5px}
.c4-dots i{width:22px;height:5px;border-radius:999px;background:hsl(var(--hairline))}
.c4-dots i.on{background:hsl(var(--c));width:30px}
.c4-media{position:relative;border-radius:22px;overflow:hidden;height:248px;background:linear-gradient(160deg,hsl(var(--g1)),hsl(var(--g2)));display:flex;align-items:flex-end;padding:16px;box-shadow:var(--shadow-md)}
.c4-media .wm{position:absolute;right:-10px;top:-20px;font-size:170px;color:#fff;opacity:.18;line-height:0}
.c4-media .play{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;color:#fff}
.c4-media .lab{position:relative;z-index:2;color:#fff}
.c4-media .lab .e{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;opacity:.85}
.c4-media .lab .n{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.c4-summary{display:flex;gap:9px;margin-top:14px}
.c4-sc{flex:1;background:hsl(var(--card));border:1px solid hsl(var(--hairline));border-radius:15px;padding:12px;text-align:center;box-shadow:var(--shadow-sm)}
.c4-sc b{font-size:20px;font-weight:800;letter-spacing:-.02em;display:block}
.c4-sc span{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:hsl(var(--ink-3))}
.c4-nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.c4-arrow{width:48px;height:48px;border-radius:50%;border:1.5px solid hsl(var(--hairline));background:hsl(var(--card));display:flex;align-items:center;justify-content:center;color:hsl(var(--ink-2));font-size:22px}
.c4-arrow.main{background:hsl(var(--c));color:#fff;border:0;flex:1;border-radius:14px;height:50px;font-size:15px;font-weight:800;gap:8px;margin:0 12px}
.c4-thumbs{display:flex;gap:8px;margin-top:16px;overflow:hidden}
.c4-th{flex:none;width:58px;height:58px;border-radius:13px;background:hsl(var(--muted));display:flex;align-items:center;justify-content:center;color:hsl(var(--ink-3));font-size:20px;border:2px solid transparent}
.c4-th.on{border-color:hsl(var(--c));background:hsl(var(--cb));color:hsl(var(--cf))}
.c4-edit-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid hsl(var(--hairline))}
.c4-edit-row .lbl{font-size:13.5px;font-weight:700}

/* =====================================================
   C5 — COACH PROGRAM (Whoop / Future / editorial)
   ===================================================== */
.c5-eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.2em;color:hsl(var(--c))}
.c5-title{font-family:'Fraunces',serif;font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1.04;margin-top:6px}
.c5-meta{font-size:13px;color:hsl(var(--ink-3));margin-top:8px;font-weight:500}
.c5-intensity{margin-top:16px}
.c5-intensity .lab{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:hsl(var(--ink-3));margin-bottom:6px}
.c5-bars{display:flex;gap:4px}
.c5-bars i{flex:1;height:7px;border-radius:3px;background:hsl(var(--hairline))}
.c5-bars i.on{background:hsl(var(--c))}
.c5-prog{margin-top:22px}
.c5-grp{font-family:'Fraunces',serif;font-size:13px;font-weight:600;color:hsl(var(--ink-3));text-transform:uppercase;letter-spacing:.12em;margin:14px 0 6px}
.c5-line{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid hsl(var(--hairline))}
.c5-az{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:hsl(var(--c));width:24px;flex:none}
.c5-nm{flex:1;font-size:15.5px;font-weight:600}
.c5-pr{font-size:14px;font-weight:700;color:hsl(var(--ink-2));font-variant-numeric:tabular-nums;letter-spacing:.01em}
.c5-note{margin-top:20px;border-left:3px solid hsl(var(--c));padding:4px 0 4px 14px}
.c5-note .h{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:hsl(var(--c));margin-bottom:5px}
.c5-note p{font-family:'Fraunces',serif;font-size:15px;font-style:italic;line-height:1.5;color:hsl(var(--ink-2))}
.c5-uline{border:0;border-bottom:1.5px solid hsl(var(--c));background:transparent;font-family:inherit;font-size:15.5px;font-weight:600;padding:3px 2px;color:hsl(var(--ink))}
.c5-cols{display:grid;grid-template-columns:340px 1fr;gap:40px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5 17.5 17.5"/><path d="M21 21l-1-1"/><path d="M3 3l1 1"/><path d="M18 22l4-4"/><path d="M2 6l4-4"/><path d="m5.5 5.5 3 3"/><path d="m15.5 15.5 3 3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-chevL" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
  <symbol id="i-chevR" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1.5 3 4.5 4.5 4.5 8.5a4.5 4.5 0 0 1-9 0c0-1.2.4-2.2 1-3 .2 1.6 1.2 2 1.2 2 .6-2-1.2-5 1.3-7.5z"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M5 5H3v1.5A3 3 0 0 0 6 9.5"/><path d="M19 5h2v1.5a3 3 0 0 1-3 3"/><path d="M9.5 14.5h5"/><path d="M10 20h4"/><path d="M12 14v6"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7 7 0 0 0 1.7-1l2.3 1 2-3.4z"/></symbol>
  <symbol id="i-weight" viewBox="0 0 24 24"><path d="M4 9v6M7.5 6.5v11M16.5 6.5v11M20 9v6M7.5 12h9"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></symbol>
</svg>

<div id="g"></div>
<script>
const G=document.getElementById('g');
const EX=[
  {nm:'Back Squat',w:100,r:5,sets:5},
  {nm:'Romanian Deadlift',w:70,r:8,sets:4},
  {nm:'Leg Press',w:160,r:12,sets:3},
  {nm:'Calf Raise',w:40,r:15,sets:4},
];
const I=(id,cls='')=>`<svg class="icon ${cls}"><use href="#i-${id}"/></svg>`;
function statusbar(){return `<div class="notch"></div><div class="sbar"><span>9:41</span><span class="r">5G<span class="batt"></span></span></div>`;}
function rail(){return `<div class="rail"><div class="logo">${I('flame')}</div>
  <a>${I('home')}</a><a class="on">${I('dumbbell')}</a><a>${I('book')}</a><a>${I('target')}</a><a>${I('trend')}</a></div>`;}
function phone(inner,{pad=true}={}){return `<div class="phone"><div class="screen">${statusbar()}${pad?`<div class="scroll">${inner}<div class="fade"></div></div>`:inner}</div></div>`;}
function deskPage(inner){return `<div class="desktop"><div class="bbar"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span><div class="url">${I('clock')} app.beme.fit/body/leg-day</div></div>
  <div class="dbody">${rail()}<div class="dmain"><div class="dscroll">${inner}<div class="fade"></div></div></div></div></div>`;}
function deskModal(panel){return `<div class="desktop"><div class="bbar"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span><div class="url">${I('clock')} app.beme.fit/body</div></div>
  <div class="dbody">${rail()}<div class="dmain">
    <div class="dscroll" style="filter:blur(2px);opacity:.5">${[1,2,3].map(()=>'<div style="height:78px;border-radius:18px;background:hsl(var(--card));border:1px solid hsl(var(--hairline));margin-bottom:13px"></div>').join('')}</div>
    <div style="position:absolute;inset:0;background:rgba(20,16,10,.4)"></div>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:26px">${panel}</div>
  </div></div></div>`;}
const col=(label,edit,frame)=>`<div class="col"><div class="lab ${edit?'edit':''}">${label}</div>${frame}</div>`;
function section(n,name,insp,desc,mv,me,dv,de){
  G.insertAdjacentHTML('beforeend',`<div class="section t-strength" id="c-${n}">
    <div class="cap"><div class="cap-row"><span class="cap-num">0${n}</span><span class="cap-title">${name}</span><span class="cap-insp">Inspired by · ${insp}</span></div><div class="cap-desc">${desc}</div></div>
    <div class="devrow">${col('Mobile · View',false,mv)}${col('Mobile · Edit',true,me)}</div>
    <div class="devrow">${col('Desktop · View',false,dv)}${col('Desktop · Edit',true,de)}</div>
  </div>`);
}

/* ---------- C1 ACTIVITY DETAIL ---------- */
const c1ring=`<div class="c1-ring"><svg width="74" height="74" viewBox="0 0 100 100" style="transform:rotate(-90deg)"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="0"/></svg><b>100%</b></div>`;
function c1hero(view){return `<div class="c1-hero"><div class="wm">${I('dumbbell')}</div><div class="row"><div><div class="k">Strength · Today</div><div class="t">Leg Day</div></div>${view?c1ring:''}</div></div>`;}
const c1stats=`<div class="c1-stats">
  <div class="c1-stat"><div class="ic">${I('clock')}</div><b>61m</b><span>Duration</span></div>
  <div class="c1-stat"><div class="ic">${I('weight')}</div><b>12.9k</b><span>Volume</span></div>
  <div class="c1-stat"><div class="ic">${I('layers')}</div><b>16</b><span>Sets</span></div>
  <div class="c1-stat"><div class="ic">${I('flame')}</div><b>482</b><span>Kcal</span></div></div>`;
function c1exView(e){return `<div class="c1-ex"><div class="c1-ex-top"><div class="c1-ex-ic">${I('dumbbell')}</div><div class="c1-ex-nm">${e.nm}</div><div class="c1-ex-sum">${e.sets} × ${e.r} · ${e.w}kg</div></div>
  <div class="c1-ex-sets">${Array.from({length:e.sets}).map((_,i)=>`<span class="c1-pill">${e.r} × ${e.w}kg</span>`).join('')}</div></div>`;}
function c1exEdit(e){return `<div class="c1-ex"><div class="c1-ex-top"><div class="c1-ex-ic">${I('dumbbell')}</div><input class="field" style="flex:1" value="${e.nm}"/></div>
  ${Array.from({length:Math.min(e.sets,2)}).map((_,i)=>`<div class="c1-setrow"><span class="c1-setn">${i+1}</span>
    <span class="step">${`<button>${I('minus')}</button><b>${e.r}</b><button>${I('plus')}</button>`}</span><span class="muted" style="font-size:11px;font-weight:700">reps</span>
    <span class="step">${`<button>${I('minus')}</button><b>${e.w}</b><button>${I('plus')}</button>`}</span><span class="muted" style="font-size:11px;font-weight:700">kg</span></div>`).join('')}
  <button class="c2-addset" style="margin-top:10px">+ Add set</button></div>`;}
const c1MV=phone(`<div class="topbar"><div class="tb-ic">${I('chevL')}</div><div class="tb-t">Workout</div><div class="tb-ic">${I('more')}</div></div>${c1hero(true)}${c1stats}<div class="c1-exh">4 Exercises</div>${EX.map(c1exView).join('')}`);
const c1ME=phone(`<div class="topbar"><div class="tb-ic">${I('x')}</div><div class="tb-t" style="font-weight:800;color:hsl(var(--ink))">Edit workout</div><div class="tb-ic">${I('check')}</div></div>
  ${c1hero(false)}
  <div style="margin-top:14px"><span class="flabel">Title</span><input class="field lg focus" value="Leg Day"/></div>
  <div style="display:flex;gap:10px;margin-top:12px"><div style="flex:1"><span class="flabel">Duration</span><span class="step" style="width:100%;justify-content:space-between"><button>${I('minus')}</button><b>61 min</b><button>${I('plus')}</button></span></div><div style="flex:1"><span class="flabel">Date</span><div class="field">${I('calendar')} Today</div></div></div>
  <div class="c1-exh">Exercises</div>${EX.slice(0,2).map(c1exEdit).join('')}<button class="dashed">${I('plus')} Add exercise</button>
  `,{pad:true}).replace('<div class="fade"></div>',`<div class="savebar"><button class="btn-ghost">Cancel</button><button class="btn-primary">${I('check')} Save workout</button></div>`);
const c1DV=deskPage(`<div class="topbar" style="height:auto;margin-bottom:18px"><div style="display:flex;align-items:center;gap:12px"><div class="tb-ic">${I('chevL')}</div><div><div class="eyebrow muted">Body · Workout</div><div style="font-size:24px;font-weight:800;letter-spacing:-.02em">Leg Day</div></div></div><button class="btn-edit">${I('pencil')} Edit</button></div>
  ${c1hero(true)}${c1stats}<div class="c1-exh">4 Exercises</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:11px">${EX.map(c1exView).join('')}</div>`);
const c1DE=deskPage(`<div class="topbar" style="height:auto;margin-bottom:18px"><div style="display:flex;align-items:center;gap:12px"><div class="tb-ic">${I('x')}</div><div style="font-size:22px;font-weight:800;letter-spacing:-.02em">Edit workout</div></div><div style="display:flex;gap:10px"><button class="btn-ghost">Cancel</button><button class="btn-edit">${I('check')} Save</button></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px"><div><span class="flabel">Title</span><input class="field lg focus" value="Leg Day"/></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><span class="flabel">Duration</span><span class="step" style="width:100%;justify-content:space-between"><button>${I('minus')}</button><b>61</b><button>${I('plus')}</button></span></div><div><span class="flabel">Date</span><div class="field">${I('calendar')} Today</div></div></div></div>
  <div class="c1-exh">Exercises</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:11px">${EX.slice(0,2).map(c1exEdit).join('')}</div><button class="dashed" style="margin-top:11px">${I('plus')} Add exercise</button>`);
section(1,'Activity Detail','Apple Fitness','A full-screen detail page (no more cramped modal). A type-gradient hero with a completion ring, four glanceable stat tiles, then exercises with their per-set breakdown. Tapping <b>Edit</b> turns the same page editable inline — title, duration stepper, and per-set reps/weight steppers. Soft, premium, spacious — the closest sibling to your chosen list design.',c1MV,c1ME,c1DV,c1DE);

/* ---------- C2 WORKOUT LOGGER ---------- */
function c2exView(e){return `<div class="c2-ex"><div class="c2-ex-h"><span class="nm">${e.nm}</span><span class="muted tnum" style="font-size:11.5px;font-weight:700">${e.sets*e.r*e.w} kg</span><span class="more">${I('more')}</span></div>
  <table class="c2-grid"><thead><tr><th>Set</th><th>Kg</th><th>Reps</th><th style="width:30px"></th></tr></thead><tbody>
  ${Array.from({length:e.sets}).map((_,i)=>`<tr class="c2-row done"><td><span class="c2-setn">${i+1}</span></td><td>${e.w}</td><td>${e.r}</td><td><span class="c2-ck on">${I('check')}</span></td></tr>`).join('')}
  </tbody></table></div>`;}
function c2exEdit(e){return `<div class="c2-ex"><div class="c2-ex-h"><span class="nm">${e.nm}</span><span class="more">${I('more')}</span></div>
  <table class="c2-grid"><thead><tr><th>Set</th><th>Kg</th><th>Reps</th><th style="width:30px"></th></tr></thead><tbody>
  ${Array.from({length:e.sets}).map((_,i)=>`<tr class="c2-row ${i<2?'done':''}"><td><span class="c2-setn">${i+1}</span></td><td><span class="c2-cell kg">${e.w}</span></td><td><span class="c2-cell">${e.r}</span></td><td><span class="c2-ck ${i<2?'on':''}">${i<2?I('check'):''}</span></td></tr>`).join('')}
  </tbody></table><button class="c2-addset">+ Add set</button></div>`;}
const c2head=`<div class="c2-head"><div class="t">Leg Day</div><div class="m"><span class="c2-mtag timer">${'⏱ 00:48:12'}</span><span class="c2-mtag">12,900 kg</span><span class="c2-mtag">16 sets</span></div></div>`;
const c2MV=phone(`<div class="topbar"><div class="tb-ic">${I('chevL')}</div><div class="tb-t">Strength</div><div class="tb-ic">${I('more')}</div></div><div class="c2-wrap">${c2head}${EX.map(c2exView).join('')}</div>`);
const c2ME=phone(`<div class="topbar"><div class="tb-ic">${I('x')}</div><div class="tb-t" style="font-weight:800;color:hsl(var(--ink))">Log workout</div><div class="tb-t" style="color:hsl(var(--c));font-weight:800">Finish</div></div>
  <div class="c2-wrap"><div class="c2-head"><input class="field lg" value="Leg Day" style="border:0;padding:0"/><div class="m"><span class="c2-mtag timer">${I('timer')} Rest 90s</span><span class="c2-mtag">16 sets</span></div></div>${EX.slice(0,2).map(c2exEdit).join('')}</div>
  <button class="dashed" style="margin-top:12px">${I('plus')} Add exercise</button>`).replace('<div class="fade"></div>',`<div class="savebar"><button class="btn-primary">${I('check')} Finish & save</button></div>`);
const c2DV=deskPage(`<div class="topbar" style="height:auto;margin-bottom:18px"><div style="display:flex;align-items:center;gap:12px"><div class="tb-ic">${I('chevL')}</div><div><div class="eyebrow muted">Strength · Today · 61 min</div><div style="font-size:24px;font-weight:800;letter-spacing:-.02em">Leg Day</div></div></div><button class="btn-edit">${I('pencil')} Edit</button></div>
  <div class="c2-wrap"><table class="c2-grid" style="font-size:13.5px"><thead><tr><th class="l" style="padding-left:15px">Exercise</th><th>Set</th><th>Previous</th><th>Kg</th><th>Reps</th><th style="width:40px"></th></tr></thead><tbody>
  ${EX.flatMap(e=>Array.from({length:e.sets}).map((_,i)=>`<tr class="c2-row done"><td class="l" style="padding-left:15px;font-weight:800;color:${'hsl(var(--cf))'}">${i===0?e.nm:''}</td><td><span class="c2-setn">${i+1}</span></td><td class="muted">${e.w}kg × ${e.r}</td><td>${e.w}</td><td>${e.r}</td><td><span class="c2-ck on">${I('check')}</span></td></tr>`)).join('')}
  </tbody></table></div>`);
const c2DE=deskPage(`<div class="topbar" style="height:auto;margin-bottom:18px"><div style="display:flex;align-items:center;gap:12px"><div class="tb-ic">${I('x')}</div><div style="font-size:22px;font-weight:800;letter-spacing:-.02em">Log workout · Leg Day</div></div><div style="display:flex;gap:10px"><span class="c2-mtag timer" style="display:flex;align-items:center;gap:6px">${I('timer')} Rest 90s</span><button class="btn-edit">${I('check')} Finish</button></div></div>
  <div class="c2-wrap"><table class="c2-grid" style="font-size:13.5px"><thead><tr><th class="l" style="padding-left:15px">Exercise</th><th>Set</th><th>Previous</th><th>Kg</th><th>Reps</th><th style="width:40px"></th></tr></thead><tbody>
  ${EX.slice(0,3).flatMap(e=>Array.from({length:e.sets}).map((_,i)=>`<tr class="c2-row ${i<2?'done':''}"><td class="l" style="padding-left:15px;font-weight:800;color:hsl(var(--cf))">${i===0?e.nm:''}</td><td><span class="c2-setn">${i+1}</span></td><td class="muted">${e.w}kg × ${e.r}</td><td><span class="c2-cell kg">${e.w}</span></td><td><span class="c2-cell">${e.r}</span></td><td><span class="c2-ck ${i<2?'on':''}">${i<2?I('check'):''}</span></td></tr>`)).join('')}
  </tbody></table></div>`);
section(2,'Workout Logger','Strong / Hevy','The serious gym-tracker. A live header (timer · volume · sets) sits above a real <b>set grid</b> — Set / Kg / Reps with a check per set. View shows completed sets ticked; Edit turns each cell into an input with “+ Add set”, a rest-timer chip and “Finish & save”. Dense, tabular, numbers-first — built for logging every set as you train.',c2MV,c2ME,c2DV,c2DE);

/* ---------- C3 BOTTOM-SHEET COMPOSER ---------- */
function c3sheet(edit){return `<div class="c3-back">${[0,1,2,3].map(()=>'<div class="bk"></div>').join('')}</div><div class="c3-dim"></div>
  <div class="c3-sheet" style="height:${edit?'74%':'66%'}"><div class="c3-grab"></div>
  ${edit?`<input class="field lg" value="Leg Day" style="border:0;padding:0"/>
    <div style="display:flex;gap:7px;margin-top:12px"><span class="seg" style="flex:1">${['Strength','Cardio','Flex'].map((t,i)=>`<span class="${i===0?'on':''}">${t}</span>`).join('')}</span></div>
    <div style="display:flex;gap:10px;margin-top:11px"><div style="flex:1"><span class="flabel">Duration</span><span class="step" style="width:100%;justify-content:space-between"><button>${I('minus')}</button><b>61</b><button>${I('plus')}</button></span></div><div style="flex:1"><span class="flabel">Date</span><div class="field">${I('calendar')} Today</div></div></div>
    <div class="c3-exh">Exercises</div>${EX.slice(0,3).map(e=>`<div class="c3-ex"><div class="ic">${I('dumbbell')}</div><div class="nm">${e.nm}</div><span class="step"><button>${I('minus')}</button><b>${e.sets}×${e.r}</b><button>${I('plus')}</button></span></div>`).join('')}`
  :`<div class="t">Leg Day</div><span class="typechip">${I('dumbbell')} Strength</span>
    <div class="c3-chips"><div class="c3-chip"><b>61m</b><span>Duration</span></div><div class="c3-chip"><b>12.9k</b><span>Volume</span></div><div class="c3-chip"><b>16</b><span>Sets</span></div></div>
    <div class="c3-exh">4 Exercises</div>${EX.map(e=>`<div class="c3-ex"><div class="ic">${I('dumbbell')}</div><div class="nm">${e.nm}</div><span class="sr">${e.sets}×${e.r} · ${e.w}kg</span></div>`).join('')}`}
  </div>
  <div class="savebar" style="z-index:40">${edit?`<button class="btn-ghost">Cancel</button><button class="btn-primary">${I('check')} Save workout</button>`:`<button class="btn-ghost" style="flex:1;justify-content:center;display:flex;align-items:center">${I('pencil')}&nbsp;Edit</button><button class="btn-primary">${I('check')} Mark done</button>`}</div>`;}
const c3MV=phone(c3sheet(false),{pad:false});
const c3ME=phone(c3sheet(true),{pad:false});
function c3panel(edit){return `<div style="width:560px;max-height:560px;background:hsl(var(--card));border-radius:22px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column">
  <div style="padding:20px 22px 0">${edit?`<div style="display:flex;justify-content:space-between;align-items:center"><input class="field lg" value="Leg Day" style="border:0;padding:0;width:auto"/><div class="tb-ic">${I('x')}</div></div>
    <div style="display:flex;gap:10px;margin-top:14px"><span class="seg" style="width:240px">${['Strength','Cardio','Flex','Sports'].map((t,i)=>`<span class="${i===0?'on':''}">${t}</span>`).join('')}</span><div><span class="step" style="justify-content:space-between"><button>${I('minus')}</button><b>61 min</b><button>${I('plus')}</button></span></div></div>
    <div class="c3-exh">Exercises</div>${EX.slice(0,3).map(e=>`<div class="c3-ex"><div class="ic">${I('dumbbell')}</div><div class="nm">${e.nm}</div><span class="step"><button>${I('minus')}</button><b>${e.sets} × ${e.r}</b><button>${I('plus')}</button></span><span class="c3-chip" style="background:hsl(var(--cb));color:hsl(var(--cf))">${e.w}kg</span></div>`).join('')}`
    :`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div style="font-size:22px;font-weight:800;letter-spacing:-.01em">Leg Day</div><span class="typechip" style="display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:hsl(var(--cf));background:hsl(var(--cb));padding:5px 10px;border-radius:999px;margin-top:8px">${I('dumbbell')} Strength</span></div><div class="tb-ic">${I('x')}</div></div>
    <div class="c3-chips" style="margin-top:16px"><div class="c3-chip"><b>61m</b><span>Duration</span></div><div class="c3-chip"><b>12.9k</b><span>Volume</span></div><div class="c3-chip"><b>16</b><span>Sets</span></div><div class="c3-chip"><b>482</b><span>Kcal</span></div></div>
    <div class="c3-exh">4 Exercises</div>${EX.map(e=>`<div class="c3-ex"><div class="ic">${I('dumbbell')}</div><div class="nm">${e.nm}</div><span class="sr">${e.sets}×${e.r} · ${e.w}kg</span></div>`).join('')}`}</div>
  <div style="padding:14px 22px;border-top:1px solid hsl(var(--hairline));display:flex;gap:10px;justify-content:flex-end">${edit?`<button class="btn-ghost">Cancel</button><button class="btn-edit">${I('check')} Save workout</button>`:`<button class="btn-ghost">${I('pencil')} Edit</button><button class="btn-edit">${I('check')} Mark done</button>`}</div></div>`;}
const c3DV=deskModal(c3panel(false));
const c3DE=deskModal(c3panel(true));
section(3,'Bottom-Sheet Composer','Google Fit / mobile-native','A rounded sheet that slides up over the list, so you never lose context. View shows summary chips + a tappable exercise list with Edit / Mark-done actions; dragging or tapping Edit expands it into inline fields — title, type pills, duration stepper, per-exercise steppers — with a sticky save bar. On desktop it becomes a centred card over a dimmed app. Fast, friendly, thumb-first.',c3MV,c3ME,c3DV,c3DE);

/* ---------- C4 GUIDED CAROUSEL ---------- */
function c4media(e,idx){return `<div class="c4-media"><div class="wm">${I('dumbbell')}</div><div class="play">${I('play')}</div><div class="lab"><div class="e">Exercise ${idx+1} of 4</div><div class="n">${e.nm}</div></div></div>`;}
const c4dots=(idx)=>`<div class="c4-dots">${EX.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('')}</div>`;
const c4thumbs=(idx)=>`<div class="c4-thumbs">${EX.map((e,i)=>`<div class="c4-th ${i===idx?'on':''}">${I('dumbbell')}</div>`).join('')}</div>`;
const c4MV=phone(`<div class="c4-top"><div class="tb-ic">${I('chevL')}</div>${c4dots(0)}<div class="tb-ic">${I('more')}</div></div>
  ${c4media(EX[0],0)}
  <div class="c4-summary"><div class="c4-sc"><b>5</b><span>Sets</span></div><div class="c4-sc"><b>5</b><span>Reps</span></div><div class="c4-sc"><b>100</b><span>Kg</span></div></div>
  ${c4thumbs(0)}
  <div class="c4-nav"><div class="c4-arrow">${I('chevL')}</div><div class="c4-arrow main">View all ${I('layers')}</div><div class="c4-arrow">${I('chevR')}</div></div>`);
const c4ME=phone(`<div class="c4-top"><div class="tb-ic">${I('x')}</div>${c4dots(0)}<div class="tb-t" style="color:hsl(var(--c));font-weight:800">Done</div></div>
  ${c4media(EX[0],0)}
  <div style="margin-top:16px"><div class="c4-edit-row"><span class="lbl">Sets</span><span class="step"><button>${I('minus')}</button><b>5</b><button>${I('plus')}</button></span></div>
  <div class="c4-edit-row"><span class="lbl">Reps</span><span class="step"><button>${I('minus')}</button><b>5</b><button>${I('plus')}</button></span></div>
  <div class="c4-edit-row" style="border-bottom:0"><span class="lbl">Weight</span><span class="step"><button>${I('minus')}</button><b>100 kg</b><button>${I('plus')}</button></span></div></div>
  ${c4thumbs(0)}
  `).replace('<div class="fade"></div>',`<div class="savebar"><div class="c4-arrow" style="border-radius:13px">${I('chevL')}</div><button class="btn-primary">Next exercise ${I('chevR')}</button></div>`);
const c4side=(idx,edit)=>`<div style="width:200px;flex:none;border-right:1px solid hsl(var(--hairline));padding-right:18px">
  <div class="eyebrow muted" style="margin-bottom:12px">Leg Day · ${edit?'Editing':'4 exercises'}</div>
  ${EX.map((e,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;margin-bottom:4px;${i===idx?'background:hsl(var(--cb))':''}">${edit?`<span style="color:hsl(var(--ink-3))">${I('grip')}</span>`:`<div style="width:26px;height:26px;border-radius:8px;background:${i===idx?'hsl(var(--c))':'hsl(var(--muted))'};color:${i===idx?'#fff':'hsl(var(--ink-3))'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">${i+1}</div>`}<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;color:${i===idx?'hsl(var(--cf))':'hsl(var(--ink))'}">${e.nm}</div><div style="font-size:11px" class="muted tnum">${e.sets}×${e.r} · ${e.w}kg</div></div></div>`).join('')}
  ${edit?`<button class="dashed" style="margin-top:8px;font-size:12px;padding:9px">${I('plus')} Add</button>`:''}</div>`;
const c4DV=deskPage(`<div class="topbar" style="height:auto;margin-bottom:18px"><div style="display:flex;align-items:center;gap:12px"><div class="tb-ic">${I('chevL')}</div><div style="font-size:24px;font-weight:800;letter-spacing:-.02em">Leg Day</div></div><button class="btn-edit">${I('pencil')} Edit</button></div>
  <div style="display:flex;gap:22px">${c4side(0,false)}<div style="flex:1">${c4media(EX[0],0)}<div class="c4-summary"><div class="c4-sc"><b>5</b><span>Sets</span></div><div class="c4-sc"><b>5</b><span>Reps</span></div><div class="c4-sc"><b>100</b><span>Kg</span></div><div class="c4-sc"><b>2,500</b><span>Volume</span></div></div></div></div>`);
const c4DE=deskPage(`<div class="topbar" style="height:auto;margin-bottom:18px"><div style="display:flex;align-items:center;gap:12px"><div class="tb-ic">${I('x')}</div><div style="font-size:22px;font-weight:800;letter-spacing:-.02em">Edit · Leg Day</div></div><button class="btn-edit">${I('check')} Save</button></div>
  <div style="display:flex;gap:22px">${c4side(0,true)}<div style="flex:1">${c4media(EX[0],0)}
  <div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px"><div><span class="flabel">Sets</span><span class="step" style="width:100%;justify-content:space-between"><button>${I('minus')}</button><b>5</b><button>${I('plus')}</button></span></div><div><span class="flabel">Reps</span><span class="step" style="width:100%;justify-content:space-between"><button>${I('minus')}</button><b>5</b><button>${I('plus')}</button></span></div><div><span class="flabel">Weight</span><span class="step" style="width:100%;justify-content:space-between"><button>${I('minus')}</button><b>100</b><button>${I('plus')}</button></span></div></div></div></div>`);
section(4,'Guided Carousel','Nike Training Club / Fitbod','Immersive and focused — one exercise at a time with big media, a play button for the demo video, progress dots and quick set/rep/weight controls. Swipe (or use the side rail on desktop) to move between exercises; an overview edits the whole workout. The most motivating, “follow-along” feel; great for guided sessions and showing real exercise imagery later.',c4MV,c4ME,c4DV,c4DE);

/* ---------- C5 COACH PROGRAM ---------- */
const c5prog=(edit)=>EX.map((e,i)=>`<div class="c5-line"><span class="c5-az">${String.fromCharCode(65+i)}</span><span class="c5-nm">${edit?`<input class="c5-uline" value="${e.nm}" style="width:200px"/>`:e.nm}</span><span class="c5-pr">${edit?`<input class="c5-uline tnum" value="${e.sets}×${e.r} · ${e.w}kg" style="width:130px;text-align:right"/>`:`${e.sets} × ${e.r} &nbsp;·&nbsp; ${e.w}kg`}</span>${edit?`<span class="muted">${I('grip')}</span>`:''}</div>`).join('');
const c5intensity=`<div class="c5-intensity"><div class="lab"><span>Intensity</span><span>Hard</span></div><div class="c5-bars">${[1,1,1,1,0].map(o=>`<i class="${o?'on':''}"></i>`).join('')}</div></div>`;
const c5MV=phone(`<div class="topbar"><div class="tb-ic">${I('chevL')}</div><div class="tb-t">Program</div><div class="tb-ic">${I('more')}</div></div>
  <div style="padding:6px 2px"><div class="c5-eyebrow">Strength · Today · 61 min</div><div class="c5-title">Leg Day</div>${c5intensity}
  <div class="c5-prog"><div class="c5-grp">Main lifts</div>${c5prog(false)}</div>
  <div class="c5-note"><div class="h">Coach's note</div><p>Keep RPE around 8. Add 2.5 kg to squats if all reps feel crisp.</p></div></div>`);
const c5ME=phone(`<div class="topbar"><div class="tb-ic">${I('x')}</div><div class="tb-t" style="font-weight:800;color:hsl(var(--ink))">Edit program</div><div class="tb-t" style="color:hsl(var(--c));font-weight:800">Save</div></div>
  <div style="padding:6px 2px"><div class="c5-eyebrow">Strength · Today</div><input class="c5-uline" value="Leg Day" style="font-family:'Fraunces',serif;font-size:32px;font-weight:600;margin-top:6px;width:100%"/>${c5intensity}
  <div class="c5-prog"><div class="c5-grp">Main lifts</div>${c5prog(true)}</div><button class="dashed" style="margin-top:14px">${I('plus')} Add exercise</button></div>`).replace('<div class="fade"></div>',`<div class="savebar"><button class="btn-ghost">Cancel</button><button class="btn-primary">${I('check')} Save program</button></div>`);
const c5DV=deskPage(`<div class="topbar" style="height:auto;margin-bottom:22px"><div style="display:flex;align-items:center;gap:12px"><div class="tb-ic">${I('chevL')}</div><div class="eyebrow muted">Body · Program</div></div><button class="btn-edit">${I('pencil')} Edit</button></div>
  <div class="c5-cols"><div><div class="c5-eyebrow">Strength · Today · 61 min</div><div class="c5-title" style="font-size:44px">Leg Day</div>${c5intensity}<div class="c5-note" style="margin-top:26px"><div class="h">Coach's note</div><p>Keep RPE around 8. Add 2.5 kg to squats if all reps feel crisp. Full rest between heavy sets.</p></div></div>
  <div><div class="c5-grp" style="margin-top:0">Main lifts</div>${c5prog(false)}</div></div>`);
const c5DE=deskPage(`<div class="topbar" style="height:auto;margin-bottom:22px"><div style="display:flex;align-items:center;gap:12px"><div class="tb-ic">${I('x')}</div><div style="font-size:22px;font-weight:800;letter-spacing:-.02em">Edit program</div></div><div style="display:flex;gap:10px"><button class="btn-ghost">Cancel</button><button class="btn-edit">${I('check')} Save</button></div></div>
  <div class="c5-cols"><div><div class="c5-eyebrow">Strength · Today</div><input class="c5-uline" value="Leg Day" style="font-family:'Fraunces',serif;font-size:40px;font-weight:600;margin-top:6px;width:100%"/>${c5intensity}<div style="margin-top:24px"><span class="flabel">Coach's note</span><div class="field" style="font-family:'Fraunces',serif;font-style:italic;color:hsl(var(--ink-2))">Keep RPE around 8. Add 2.5 kg to squats if all reps feel crisp.</div></div></div>
  <div><div class="c5-grp" style="margin-top:0">Main lifts</div>${c5prog(true)}<button class="dashed" style="margin-top:16px">${I('plus')} Add exercise</button></div></div>`);
section(5,'Coach Program','Whoop / Future / editorial','A premium, editorial “coached program” feel. A large Fraunces title, an intensity meter, and exercises typeset as a clean program (A / B / C, sets × reps · load) with a coach’s-note block. Edit uses elegant underline inputs and drag-to-reorder. The most distinctive, design-led option — leans into your serif display font and makes a plain workout feel considered and high-end.',c5MV,c5ME,c5DV,c5DE);
</script>
</body>
</html>
